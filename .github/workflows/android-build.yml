name: Android (Google Play) build

# Builds the Trusted Web Activity wrapper for https://byggvaktai.com with Bubblewrap.
# Runs only on the android-build branch or manually; it never touches the website.
#
# Required repository secret:
#   ANDROID_KEYSTORE_PASSWORD  - password for the upload key (choose it yourself, keep it safe)
# Optional repository secret (for later updates, so the same upload key is reused):
#   ANDROID_KEYSTORE_BASE64    - base64 of android.keystore from the first build

on:
  push:
    branches: [android-build]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check password secret
        id: pw
        run: |
          if [ -z "$KS_PASS" ] || [ ${#KS_PASS} -lt 8 ]; then
            echo "::error::Add repository secret ANDROID_KEYSTORE_PASSWORD (at least 8 characters)."
            exit 1
          fi

      - uses: actions/setup-java@v5
        id: java
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        id: node
        with:
          node-version: "22"

      - name: Build with Bubblewrap
        id: bw
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set +e +o pipefail
          fail() {
            echo "FAILED: $1" >> build.log
            tail -n 40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=Bubblewrap::/' ; echo
            exit 1
          }
          npm install -g @bubblewrap/cli@1 >> build.log 2>&1 || fail "npm install"
          mkdir -p ~/.bubblewrap
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $ANDROID_HOME" >> build.log; ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" >> build.log 2>&1
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json >> build.log
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
          else
            keytool -genkeypair -keystore android.keystore -storetype PKCS12 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Pukitis Elite, O=Pukitis Elite, L=Drammen, C=NO" >> build.log 2>&1 || fail "keytool"
          fi
          keytool -list -v -keystore android.keystore -alias upload -storepass "$KS_PASS" | grep -i "SHA256:" | sed 's/^/::notice title=Upload key::/'
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json >> build.log 2>&1 || fail "bubblewrap update"
          yes | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json >> build.log 2>&1 || fail "bubblewrap build"
          ls -la >> build.log
          [ -f app-release-bundle.aab ] || fail "no aab produced"
          mkdir -p out
          cp app-release-bundle.aab out/byggvakt-ai.aab
          cp app-release-signed.apk out/byggvakt-ai.apk 2>/dev/null
          cp android.keystore out/android.keystore
          [ -f assetlinks.json ] && cp assetlinks.json out/
          printf 'byggvakt-ai.aab  -> Google Play Console\nandroid.keystore -> upload key (alias: upload), passord = ANDROID_KEYSTORE_PASSWORD. Ta vare pa den, ikke del den.\nbyggvakt-ai.apk  -> test pa telefonen\n' > out/LES-MEG.txt
          echo "::notice title=Ferdig::AAB bygget"

      - name: Report failed step
        if: failure()
        run: echo "::error title=Steps::${{ join(steps.*.outcome, ',') }} (pw,java,node,bw)"

      - uses: actions/upload-artifact@v4
        with:
          name: byggvakt-ai-android
          path: android/out/
          retention-days: 1
